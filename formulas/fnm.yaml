name: fnm
description: Fast and simple Node.js version manager
type: cli
homepage: https://github.com/Schniz/fnm
repository: ochairo/potions
license: GPL-3.0
tags:
  - nodejs
  - version-manager
  - cli
binaries:
  - fnm
platforms:
  darwin:
    amd64:
      download_url: https://github.com/ochairo/potions/releases/download/fnm-{version}/fnm-{version}-darwin-amd64.tar.gz
      checksum_url: https://github.com/ochairo/potions/releases/download/fnm-{version}/fnm-{version}-darwin-amd64.tar.gz.sha256
      requires_build: false
    arm64:
      download_url: https://github.com/ochairo/potions/releases/download/fnm-{version}/fnm-{version}-darwin-arm64.tar.gz
      checksum_url: https://github.com/ochairo/potions/releases/download/fnm-{version}/fnm-{version}-darwin-arm64.tar.gz.sha256
      requires_build: false
  linux:
    amd64:
      download_url: https://github.com/ochairo/potions/releases/download/fnm-{version}/fnm-{version}-linux-amd64.tar.gz
      checksum_url: https://github.com/ochairo/potions/releases/download/fnm-{version}/fnm-{version}-linux-amd64.tar.gz.sha256
      requires_build: false
    arm64:
      download_url: https://github.com/ochairo/potions/releases/download/fnm-{version}/fnm-{version}-linux-arm64.tar.gz
      checksum_url: https://github.com/ochairo/potions/releases/download/fnm-{version}/fnm-{version}-linux-arm64.tar.gz.sha256
      requires_build: false
