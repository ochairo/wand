name: cocoapods
description: Dependency manager for Swift and Objective-C Cocoa projects
type: cli
homepage: https://cocoapods.org/
repository: ochairo/potions
license: MIT
tags:
  - dependency-manager
  - swift
  - ios
binaries:
  - pod
platforms:
  darwin:
    amd64:
      download_url: https://github.com/ochairo/potions/releases/download/cocoapods-{version}/cocoapods-{version}-darwin-amd64.tar.gz
      checksum_url: https://github.com/ochairo/potions/releases/download/cocoapods-{version}/cocoapods-{version}-darwin-amd64.tar.gz.sha256
      requires_build: false
    arm64:
      download_url: https://github.com/ochairo/potions/releases/download/cocoapods-{version}/cocoapods-{version}-darwin-arm64.tar.gz
      checksum_url: https://github.com/ochairo/potions/releases/download/cocoapods-{version}/cocoapods-{version}-darwin-arm64.tar.gz.sha256
      requires_build: false
  linux:
    amd64:
      download_url: https://github.com/ochairo/potions/releases/download/cocoapods-{version}/cocoapods-{version}-linux-amd64.tar.gz
      checksum_url: https://github.com/ochairo/potions/releases/download/cocoapods-{version}/cocoapods-{version}-linux-amd64.tar.gz.sha256
      requires_build: false
    arm64:
      download_url: https://github.com/ochairo/potions/releases/download/cocoapods-{version}/cocoapods-{version}-linux-arm64.tar.gz
      checksum_url: https://github.com/ochairo/potions/releases/download/cocoapods-{version}/cocoapods-{version}-linux-arm64.tar.gz.sha256
      requires_build: false
