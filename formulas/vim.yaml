name: vim
description: Vi IMproved - enhanced vi editor
type: cli
homepage: https://www.vim.org/
repository: ochairo/potions
license: Vim
tags:
  - editor
  - cli
binaries:
  - vim
platforms:
  darwin:
    amd64:
      download_url: https://github.com/ochairo/potions/releases/download/vim-{version}/vim-{version}-darwin-amd64.tar.gz
      checksum_url: https://github.com/ochairo/potions/releases/download/vim-{version}/vim-{version}-darwin-amd64.tar.gz.sha256
      requires_build: false
    arm64:
      download_url: https://github.com/ochairo/potions/releases/download/vim-{version}/vim-{version}-darwin-arm64.tar.gz
      checksum_url: https://github.com/ochairo/potions/releases/download/vim-{version}/vim-{version}-darwin-arm64.tar.gz.sha256
      requires_build: false
  linux:
    amd64:
      download_url: https://github.com/ochairo/potions/releases/download/vim-{version}/vim-{version}-linux-amd64.tar.gz
      checksum_url: https://github.com/ochairo/potions/releases/download/vim-{version}/vim-{version}-linux-amd64.tar.gz.sha256
      requires_build: false
    arm64:
      download_url: https://github.com/ochairo/potions/releases/download/vim-{version}/vim-{version}-linux-arm64.tar.gz
      checksum_url: https://github.com/ochairo/potions/releases/download/vim-{version}/vim-{version}-linux-arm64.tar.gz.sha256
      requires_build: false
