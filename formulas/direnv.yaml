name: direnv
description: Load and unload environment variables based on the current directory
type: cli
homepage: https://direnv.net/
repository: ochairo/potions
license: MIT
tags:
  - environment
  - cli
binaries:
  - direnv
platforms:
  darwin:
    amd64:
      download_url: https://github.com/ochairo/potions/releases/download/direnv-{version}/direnv-{version}-darwin-amd64.tar.gz
      checksum_url: https://github.com/ochairo/potions/releases/download/direnv-{version}/direnv-{version}-darwin-amd64.tar.gz.sha256
      requires_build: false
    arm64:
      download_url: https://github.com/ochairo/potions/releases/download/direnv-{version}/direnv-{version}-darwin-arm64.tar.gz
      checksum_url: https://github.com/ochairo/potions/releases/download/direnv-{version}/direnv-{version}-darwin-arm64.tar.gz.sha256
      requires_build: false
  linux:
    amd64:
      download_url: https://github.com/ochairo/potions/releases/download/direnv-{version}/direnv-{version}-linux-amd64.tar.gz
      checksum_url: https://github.com/ochairo/potions/releases/download/direnv-{version}/direnv-{version}-linux-amd64.tar.gz.sha256
      requires_build: false
    arm64:
      download_url: https://github.com/ochairo/potions/releases/download/direnv-{version}/direnv-{version}-linux-arm64.tar.gz
      checksum_url: https://github.com/ochairo/potions/releases/download/direnv-{version}/direnv-{version}-linux-arm64.tar.gz.sha256
      requires_build: false
