name: podman-compose
description: Script to run docker-compose.yml using podman
type: cli
homepage: https://github.com/containers/podman-compose
repository: ochairo/potions
license: GPL-2.0
tags:
  - container
  - podman
  - compose
binaries:
  - podman-compose
platforms:
  darwin:
    amd64:
      download_url: https://github.com/ochairo/potions/releases/download/podman-compose-{version}/podman-compose-{version}-darwin-amd64.tar.gz
      checksum_url: https://github.com/ochairo/potions/releases/download/podman-compose-{version}/podman-compose-{version}-darwin-amd64.tar.gz.sha256
      requires_build: false
    arm64:
      download_url: https://github.com/ochairo/potions/releases/download/podman-compose-{version}/podman-compose-{version}-darwin-arm64.tar.gz
      checksum_url: https://github.com/ochairo/potions/releases/download/podman-compose-{version}/podman-compose-{version}-darwin-arm64.tar.gz.sha256
      requires_build: false
  linux:
    amd64:
      download_url: https://github.com/ochairo/potions/releases/download/podman-compose-{version}/podman-compose-{version}-linux-amd64.tar.gz
      checksum_url: https://github.com/ochairo/potions/releases/download/podman-compose-{version}/podman-compose-{version}-linux-amd64.tar.gz.sha256
      requires_build: false
    arm64:
      download_url: https://github.com/ochairo/potions/releases/download/podman-compose-{version}/podman-compose-{version}-linux-arm64.tar.gz
      checksum_url: https://github.com/ochairo/potions/releases/download/podman-compose-{version}/podman-compose-{version}-linux-arm64.tar.gz.sha256
      requires_build: false
