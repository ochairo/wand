name: argon2
description: Password hashing library and CLI utility
type: cli
homepage: https://github.com/P-H-C/phc-winner-argon2
repository: ochairo/potions
license: Apache-2.0
tags:
  - security
  - crypto
  - hashing
binaries:
  - argon2
platforms:
  darwin:
    amd64:
      download_url: https://github.com/ochairo/potions/releases/download/argon2-{version}/argon2-{version}-darwin-amd64.tar.gz
